<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proximiter Drift Training System</title>
<style>
body {
    background:#0f0f0f;
    font-family:Arial,sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    padding:20px;
}

.container {
    background:#1a1a1a;
    padding:30px;
    border-radius:12px;
    width:450px;
    max-width:95%;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
    text-align:center;
}

.logo {
    width:100%;
    height:auto;
    margin-bottom:20px;
    border-radius:12px; /* zaokrąglone rogi */
}

p {
    font-size:13px;
    color:#aaa;
    margin-bottom:20px;
}

.field-group {
    margin-bottom:18px;
    text-align:left;
}

label {
    display:block;
    margin-bottom:6px;
    font-size:14px;
}

input[type="text"], input[type="email"] {
    width:100%;
    padding:10px;
    border-radius:6px;
    border:none;
    background:#2a2a2a;
    color:white;
    font-size:14px;
}

button {
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#ff2e2e;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
    transition:0.2s;
}

button:hover { background:#ff4d4d; }

.hint {
    margin-top:5px;
    font-size:12px;
    color:#bbb;
    background:#222;
    padding:6px 10px;
    border-radius:6px;
}

#formMessage { margin-top:12px; font-size:13px; text-align:center; }

.steam-img {
    display:block;
    max-width:100%;
    max-height:150px;
    margin-top:10px;
    border-radius:12px;
    object-fit:contain;
}
</style>
</head>
<body>

<div class="container">
  <img class="logo" src="logo.png" alt="Proximiter Drift Training Logo">

  <p>Complete this form to receive access to the car pack. Access is granted manually after verification.</p>

  <form id="verificationForm">
    <div class="field-group">
      <label>Email Address</label>
      <input type="email" name="email" required>
      <div class="hint">Your email where verification will be sent.</div>
    </div>

    <div class="field-group">
      <label>SteamID (64-bit)</label>
      <input type="text" name="steamid" placeholder="7656119XXXXXXXXXX" required>
      <div class="hint">
        Your SteamID can be found in the Content Manager as shown in the image below,  
        or on the page: <a href="https://steamid.io" target="_blank" style="color:#ff2e2e;text-decoration:underline;">steamid.io</a>
        <img class="steam-img" src="steamidsmall.jpg" alt="SteamID example">
      </div>
    </div>

    <div class="field-group">
      <label>Discord Username</label>
      <input type="text" name="discord" required>
      <div class="hint">Your Discord name with tag, e.g., UserName#1234.</div>
    </div>

    <button type="submit">Submit Verification</button>
    <p id="formMessage"></p>
  </form>
</div>

<script>
// Wklej tutaj swój URL Google Apps Script (Web App)
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1MpZ29ja-bnnqz6taceLwKm9-55YUEQ1AN3uSHoCVCa4/edit?gid=0#gid=0';

const form = document.getElementById('verificationForm');
const message = document.getElementById('formMessage');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(form);
  const data = Object.fromEntries(formData.entries());

  try {
    const res = await fetch(SHEET_URL, {
      method: 'POST',
      body: JSON.stringify(data),
      headers: { 'Content-Type': 'application/json' }
    });
    const json = await res.json();

    if (json.success) {
      message.style.color = '#4fff4f';
      message.textContent = 'Form submitted successfully!';
      form.reset();
    } else {
      message.style.color = '#ff4d4d';
      message.textContent = json.error || 'Error submitting the form.';
    }
  } catch(err) {
    message.style.color = '#ff4d4d';
    message.textContent = 'Failed to submit the form.';
    console.error(err);
  }
});
</script>

</body>
</html>
