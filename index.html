<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Proximiter Drift Training</title>
</head>
<body>
<h1>Proximiter Drift Training Form</h1>
<form id="form">
  <input name="email" placeholder="Email" required><br>
  <input name="steamid" placeholder="SteamID" required><br>
  <input name="patreon" placeholder="Patreon username"><br>
  <input name="discord" placeholder="Discord"><br>
  <input type="checkbox" name="confirm" required> Confirm<br>
  <button type="submit">Submit</button>
</form>
<p id="message"></p>
<pre id="debug"></pre>

<script>
const form = document.getElementById('form')
const message = document.getElementById('message')
const debug = document.getElementById('debug')

form.addEventListener('submit', async e => {
  e.preventDefault()
  const data = new FormData(form)
  try {
    const res = await fetch('https://hidden-moon-7f9f.peter.proximiter.workers.dev', { method:'POST', body:data })
    const json = await res.json()
    if (json.success) {
      message.textContent = 'Submitted successfully!'
      message.style.color = 'green'
      form.reset()
    } else {
      message.textContent = json.error
      message.style.color = 'red'
    }
    debug.textContent = JSON.stringify(json, null, 2)
  } catch (err) {
    message.textContent = 'Failed to submit the form.'
    debug.textContent = err.message
  }
})
</script>
</body>
</html>
