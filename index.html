<script>
const form = document.getElementById('verificationForm');
const message = document.getElementById('formMessage');
const WORKER_URL = 'https://hidden-moon-7f9f.peter-proximiter.workers.dev';

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(form);

  let steamid = formData.get('steamid');

  // Usuwamy spacje i niewidoczne znaki
  steamid = steamid.trim();

  // Sprawdzamy czy zawiera tylko cyfry
  if (!/^\d+$/.test(steamid)) {
    showError('SteamID must contain only numbers.');
    return;
  }

  // Sprawdzamy długość
  if (steamid.length !== 17) {
    showError('SteamID must be exactly 17 digits.');
    return;
  }

  // Sprawdzamy czy zaczyna się od poprawnego prefixu
  if (!steamid.startsWith('7656119')) {
    showError('Invalid SteamID64. It should start with 7656119.');
    return;
  }

  // Nadpisujemy oczyszczoną wartość
  formData.set('steamid', steamid);

  try {
    const res = await fetch(WORKER_URL, { 
      method:'POST', 
      body:formData 
    });

    const json = await res.json();

    if (json.success) {
      message.style.color = '#4fff4f';
      message.textContent = 'Form submitted successfully!';
      form.reset();
    } else {
      showError(json.error || 'Error submitting the form.');
    }
  } catch {
    showError('Failed to submit the form.');
  }
});

function showError(text) {
  message.style.color = '#ff4d4d';
  message.textContent = text;
}
</script>
